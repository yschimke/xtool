name: KMP Integration

# Integration test for xtool's Kotlin Multiplatform support: builds a real-world
# KMP app (PeopleInSpace) end-to-end with xtool on macOS — Gradle assembles the
# shared XCFramework (Kotlin/Native iOS compile), xtool stages + embeds it, and
# SwiftPM compiles the SwiftUI app against it. Stops short of signing/device
# install (no Apple account needed), which is the most CI can verify headlessly.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  peopleinspace:
    name: Build PeopleInSpace with xtool
    runs-on: macos-26
    steps:
      - name: Checkout xtool
        uses: actions/checkout@v6

      - uses: ./.github/actions/configure-xcode

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build xtool
        run: swift build --product xtool

      - name: Checkout PeopleInSpace
        uses: actions/checkout@v6
        with:
          repository: yschimke/PeopleInSpace
          ref: agent/xtool-kmp-builds
          path: peopleinspace
          # PeopleInSpace is a public fork; no token needed. If it becomes
          # private, supply `token:` with a PAT that can read it.

      - name: Build the xtool app
        working-directory: peopleinspace/xtoolApp
        env:
          # PeopleInSpace turns on Gradle's configuration cache, which the
          # multiplatform-swiftpackage plugin isn't compatible with. xtool drives
          # gradlew directly with no arg passthrough, so disable it via the
          # environment (gradlew honors GRADLE_OPTS system properties).
          GRADLE_OPTS: "-Dorg.gradle.configuration-cache=false -Dorg.gradle.unsafe.configuration-cache=false"
        run: |
          set -euo pipefail
          XTOOL="$GITHUB_WORKSPACE/.build/debug/xtool"
          "$XTOOL" --version || true
          # Assembles :common's PeopleInSpaceKit XCFramework, stages + embeds it,
          # then compiles the SwiftUI app for arm64-apple-ios. No --sign: we are
          # validating the build, not installing to a device.
          "$XTOOL" dev build

      - name: Verify the app embeds the KMP framework
        working-directory: peopleinspace/xtoolApp
        run: |
          set -euo pipefail
          APP="xtool/PeopleInSpaceXtool.app"
          if [ ! -d "$APP" ]; then
            echo "::error::xtool dev build did not produce $APP"
            ls -la xtool || true
            exit 1
          fi
          echo "Built $APP"; ls -lR "$APP"

          # The shared Kotlin framework is dynamic, so it MUST be embedded under
          # Frameworks/ — otherwise the app links against a dylib that isn't in
          # the bundle and crashes at launch. Name-agnostic: the XCFramework's
          # inner framework baseName need not match the SwiftPM target name.
          FW=$(find "$APP/Frameworks" -maxdepth 1 -name '*.framework' -type d 2>/dev/null | head -n1 || true)
          if [ -z "$FW" ]; then
            echo "::error::No embedded framework under $APP/Frameworks — the KMP shared framework was not packaged, so the app would not launch."
            exit 1
          fi
          FW_NAME=$(basename "$FW" .framework)
          echo "Embedded framework: $FW"
          test -f "$FW/$FW_NAME" || { echo "::error::$FW has no Mach-O binary '$FW_NAME'"; exit 1; }

          # The app binary must actually link the embedded framework.
          otool -L "$APP/PeopleInSpaceXtool" | grep -q "$FW_NAME.framework/$FW_NAME" \
            || { echo "::error::app binary does not link $FW_NAME.framework"; \
                 otool -L "$APP/PeopleInSpaceXtool"; exit 1; }
          echo "App links $FW_NAME.framework ✓"

      - name: Package the test app
        working-directory: peopleinspace/xtoolApp
        run: |
          set -euo pipefail
          APP="xtool/PeopleInSpaceXtool.app"
          # ditto (not `zip`) so the bundle's symlinks/resources survive the round
          # trip. This is an unsigned arm64-apple-ios .app: install it to a device
          # with `xtool install PeopleInSpaceXtool.app` (xtool signs on install).
          ditto -c -k --sequesterRsrc --keepParent "$APP" PeopleInSpaceXtool-ios.app.zip
          ls -la PeopleInSpaceXtool-ios.app.zip

      - name: Upload test app artifact
        uses: actions/upload-artifact@v4
        with:
          name: PeopleInSpaceXtool-ios-app
          path: peopleinspace/xtoolApp/PeopleInSpaceXtool-ios.app.zip
          if-no-files-found: error
          retention-days: 14
